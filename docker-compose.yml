services:
  web:
    build: .
    image: ghcr.io/${GITHUB_REPOSITORY:-your-org/itfehervar}:latest
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-3000}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_SECURE=${SMTP_SECURE}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SIROTECH_ADMIN_EMAIL=${SIROTECH_ADMIN_EMAIL}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL}
      - NEXT_PUBLIC_SIRONIC_PHONE=${NEXT_PUBLIC_SIRONIC_PHONE}
      - NEXT_PUBLIC_GA_ID=${NEXT_PUBLIC_GA_ID}
    restart: unless-stopped
